name: Build & Release Free Display

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Free Display APK
        run: ./gradlew :freedisplay:assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p release_apks

          if [ -f "freedisplay/build/outputs/apk/debug/freedisplay-debug.apk" ]; then
            cp "freedisplay/build/outputs/apk/debug/freedisplay-debug.apk" "release_apks/FreeDisplay-${TAG}.apk"
          fi

          cd release_apks
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          name: "Free Display ${{ steps.prepare_artifacts.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_apks/FreeDisplay-*.apk
            release_apks/sha256_checksums.txt
          body: |
            ## 📱 Free Display ${{ steps.prepare_artifacts.outputs.tag }} 发布

            > **📅 发布日期**：2026年11月21日  
            > **通用、轻量、低延迟无线副屏接收端软件，让闲置设备秒变专业低延迟副屏。**

            ### 📦 下载安装
            - **`FreeDisplay-${{ steps.prepare_artifacts.outputs.tag }}.apk`**：**安卓通用安装包**（支持主流 Android 手机、平板及智能电视免 Root 直接安装使用）

            ### 🚀 主要特性
            - 🖥️ **电脑无线扩展 / 镜像**：支持 60fps 高帧率、低延迟硬件直通解码
            - 📱 **移动端投屏**：兼容 Wi-Fi Display (Miracast)，支持手机镜像与电脑桌面模式
            - 👆 **反向触控精准映射**：零漂移视口黑边消除，指哪打哪
            - ⚡ **快速热点与直连**：内置 2.4GHz 快速热点支持与扫码极速互联
            - 🖼️ **纯净待机模式**：沉浸极简待机画面，免打扰

            校验和见附带的 `sha256_checksums.txt`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
