name: Build & Release Free Display

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore (if configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > freedisplay/release.jks
            echo "HAS_RELEASE_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build Free Display APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            ./gradlew :freedisplay:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :freedisplay:assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p release_apks

          if [ -f "freedisplay/build/outputs/apk/release/freedisplay-release.apk" ]; then
            cp "freedisplay/build/outputs/apk/release/freedisplay-release.apk" "release_apks/FreeDisplay-${TAG}.apk"
          elif [ -f "freedisplay/build/outputs/apk/debug/freedisplay-debug.apk" ]; then
            cp "freedisplay/build/outputs/apk/debug/freedisplay-debug.apk" "release_apks/FreeDisplay-${TAG}.apk"
          elif [ -f "/tmp/n1_build/freedisplay/outputs/apk/debug/freedisplay-debug.apk" ]; then
            cp "/tmp/n1_build/freedisplay/outputs/apk/debug/freedisplay-debug.apk" "release_apks/FreeDisplay-${TAG}.apk"
          fi

          cd release_apks
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          name: "Free Display ${{ steps.prepare_artifacts.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_apks/FreeDisplay-*.apk
            release_apks/sha256_checksums.txt
          body: |
            ## 📱 Free Display ${{ steps.prepare_artifacts.outputs.tag }} 发布

            > **📅 发布日期**：2026年11月26日  
            > **通用、轻量、低延迟无线副屏接收端软件，让闲置设备秒变专业低延迟副屏。**

            ### 📦 下载安装
            - **`FreeDisplay-${{ steps.prepare_artifacts.outputs.tag }}.apk`**：**安卓通用安装包**（支持主流 Android 手机、平板及智能电视免 Root 直接安装使用）

            ### 🚀 v1.1.0 更新亮点
            - ✨ **Apple Liquid Glass 液态玻璃 UI**：全新磨砂高光待机面板、精简顶部控制中心与「⋯ 更多」玻璃网格面板，彻底解决底部裁剪
            - 📐 **关于弹窗横竖屏动态布局**：竖屏单列、横屏双栏并排展示，全区块统一玻璃卡片边框
            - 💻 **完整支持 Windows 无线副屏触控**：支持 Windows 10/11 (`Win+K`) Miracast UIBC 点击与拖拽滑动，内置 Windows 开启向导
            - 📱 **Android / 鸿蒙反向触控增强**：支持自愈重连、自定义端口及单弹窗分步开启向导（含鸿蒙 4.2 专属指引）
            - 🖼️ **纯净待机 & 弹窗互斥**：有弹窗显示时自动隐藏待机信息，视觉更专注

            校验和见附带的 `sha256_checksums.txt`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
